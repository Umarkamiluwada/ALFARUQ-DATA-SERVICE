name: Build ALFARUQ DATA SERVICE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/alfaruq/dataservice
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ALFARUQ-DATA-SERVICE"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.alfaruq.dataservice'
              compileSdk 35

              defaultConfig {
                  applicationId "com.alfaruq.dataservice"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">ALFARUQ DATA SERVICE</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="ALFARUQ DATA SERVICE"
                  android:usesCleartextTraffic="true"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#087D5B</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#064D3B</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/alfaruq/dataservice/MainActivity.java <<'EOF'
          package com.alfaruq.dataservice;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://raw.githubusercontent.com/Umarkamiliwada/ALFARUQ-DATA-SERVICE/main/app.html");

                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  WebView webView = (WebView) findViewById(android.R.id.content);
                  super.onBackPressed();
              }
          }
          EOF

          cat > app.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ALFARUQ DATA SERVICE</title>
          <style>
          *{box-sizing:border-box}
          body{margin:0;background:#eef3f1;font-family:Arial,sans-serif;color:#12231d}
          .top{background:linear-gradient(145deg,#064d3b,#0a9a70);color:white;padding:25px 20px;border-radius:0 0 28px 28px}
          .brand{font-size:18px;font-weight:bold}
          .hello{margin-top:25px;font-size:14px}
          .balance{font-size:32px;font-weight:bold;margin:8px 0 18px}
          button{border:0;border-radius:13px;padding:13px 17px;font-weight:bold}
          .add{background:white;color:#087d5b}
          .content{padding:20px}
          h3{margin-top:5px}
          .services{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          .card{background:white;padding:18px;border-radius:18px;box-shadow:0 5px 20px #0001}
          .icon{font-size:27px}
          .card b{display:block;margin-top:9px}
          .card small{color:#71807b}
          .tx{background:white;padding:14px;border-radius:14px;margin:10px 0;display:flex;justify-content:space-between}
          .green{color:#087d5b;font-weight:bold}
          .bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:13px;text-align:center;color:#087d5b;font-weight:bold}
          </style>
          </head>
          <body>

          <div class="top">
            <div class="brand">🟢 ALFARUQ DATA SERVICE</div>
            <div class="hello">Welcome back 👋</div>
            <div class="balance">₦25,000.00</div>
            <button class="add" onclick="alert('Demo mode: real payment will be added later.')">+ Add Money</button>
          </div>

          <div class="content">
            <h3>Services</h3>

            <div class="services">
              <div class="card" onclick="demo('Buy Data')">
                <span class="icon">🌐</span>
                <b>Buy Data</b>
                <small>MTN • Airtel • Glo • 9mobile</small>
              </div>

              <div class="card" onclick="demo('Airtime')">
                <span class="icon">📱</span>
                <b>Airtime</b>
                <small>Instant recharge</small>
              </div>

              <div class="card" onclick="demo('TV Subscription')">
                <span class="icon">📺</span>
                <b>TV Subscription</b>
                <small>DStv • GOtv</small>
              </div>

              <div class="card" onclick="demo('Electricity')">
                <span class="icon">⚡</span>
                <b>Electricity</b>
                <small>Pay electricity bills</small>
              </div>
            </div>

            <h3 style="margin-top:28px">Recent Transactions</h3>

            <div class="tx">
              <span>MTN Data<br><small>Demo transaction</small></span>
              <span class="green">-₦500</span>
            </div>

            <div class="tx">
              <span>Wallet Deposit<br><small>Demo transaction</small></span>
              <span class="green">+₦5,000</span>
            </div>
          </div>

          <div class="bottom">
            ALFARUQ DATA SERVICE • Demo Version 1.0
          </div>

          <script>
          function demo(service){
              alert(service + ' selected.\\n\\nThis is the demo version. Real payment and VTU services will be connected later.');
          }
          </script>

          </body>
          </html>
          EOF

      - name: Create Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.9

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALFARUQ-DATA-SERVICE-APK
          path: app/build/outputs/apk/debug/app-debug.apk
